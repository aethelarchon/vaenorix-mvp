<body>
    <div class="container">
        <nav class="navbar">
            <a class="logo" href="/" aria-label="Vaenorix home">
                <span class="logo-icon" aria-hidden="true">🧠</span>
                <span class="logo-text">Vaenorix</span>
            </a>
            <div class="nav-actions">
                <span id="accountStatus" class="account-status" role="status">Checking sign-in…</span>
                <button id="loginBtn" class="login-btn" type="button">Sign in with Google</button>
                <button id="logoutBtn" class="logout-btn" type="button" hidden>Sign out</button>
            </div>
        </nav>

        <main>
            <section class="hero">
                <h1 class="hero-title">Your <span class="glow-text">AI Second Brain</span></h1>
                <p class="hero-desc">Save notes and links. Find them again when you need them.</p>
                <button id="getStartedBtn" class="btn-primary" type="button">Save a memory</button>
            </section>

            <section id="save-section" class="save-section">
                <h2 class="section-title">Save a memory</h2>
                <form id="memoryForm" class="input-group">
                    <label class="field-label" for="noteInput">Note</label>
                    <textarea id="noteInput" name="note" rows="4" placeholder="Write down an idea, detail, or reminder…"></textarea>
                    <label class="field-label" for="linkInput">Link <span>(optional)</span></label>
                    <input id="linkInput" name="link" type="url" placeholder="https://example.com">
                    <button id="saveBtn" class="btn-primary" type="submit">Save to Second Brain</button>
                </form>
            </section>

            <section class="search-section">
                <h2 class="section-title">Search memories</h2>
                <form id="searchForm" class="search-box" role="search">
                    <input id="searchInput" type="search" placeholder="Search notes and links…" aria-label="Search saved memories">
                    <button id="searchBtn" class="btn-search" type="submit">Search</button>
                </form>
            </section>

            <section class="memories-section">
                <div class="memories-heading">
                    <h2 class="section-title">Saved memories <span id="memoryCount" class="memory-count">(0)</span></h2>
                </div>
                <div class="filter-buttons" role="group" aria-label="Filter memories">
                    <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">All</button>
                    <button class="filter-btn" type="button" data-filter="note" aria-pressed="false">Notes</button>
                    <button class="filter-btn" type="button" data-filter="link" aria-pressed="false">Links</button>
                    <button class="filter-btn" type="button" data-filter="image" aria-pressed="false">Images</button>
                    <button id="clearAllBtn" class="clear-all-btn" type="button">Clear all</button>
                    <button id="exportBtn" class="export-btn" type="button">Export data</button>
                </div>
                <div id="memories-container" class="memories-list" aria-live="polite">
                    <p class="empty-message">Sign in to see your memories.</p>
                </div>
            </section>
        </main>
    </div>

    <footer class="footer">
        <p>Vaenorix — Your AI Second Brain</p>
        <p class="footer-small">Save anything. Find everything later.</p>
    </footer>
