<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Shared Memory — Vaenorix</title>
    <meta property="og:title" content="A memory from Vaenorix">
    <meta property="og:description" content="Check out this memory shared from Vaenorix — Your AI Second Brain.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/brain.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .share-container {
            max-width: 640px;
            margin: 40px auto;
            width: 100%;
            flex: 1;
        }
        .share-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .share-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .share-logo i {
            color: #a855f7;
            -webkit-text-fill-color: #a855f7;
            font-size: 26px;
        }
        .share-tagline {
            color: #9ca3af;
            font-size: 13px;
        }
        .share-card {
            background: linear-gradient(145deg, rgba(26, 20, 40, 0.9), rgba(20, 16, 32, 0.9));
            border: 1.5px solid rgba(139, 92, 246, 0.25);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(139, 92, 246, 0.1);
            animation: cardFadeIn 0.5s ease;
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .share-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 50px;
            color: #c084fc;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        .share-content {
            font-size: 17px;
            line-height: 1.7;
            color: #e5e7eb;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .share-content a {
            color: #c084fc;
            text-decoration: none;
            word-break: break-all;
        }
        .share-image {
            width: 100%;
            border-radius: 16px;
            margin-top: 8px;
        }
        .share-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(139, 92, 246, 0.15);
        }
        .share-tag {
            padding: 4px 12px;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 50px;
            color: #c084fc;
            font-size: 12px;
            font-weight: 500;
        }
        .share-tag::before {
            content: '#';
            opacity: 0.7;
            margin-right: 2px;
        }
        .share-footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(139, 92, 246, 0.15);
            font-size: 12px;
            color: #6b7280;
            flex-wrap: wrap;
            gap: 10px;
        }
        .share-footer-info span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .share-footer-info i {
            color: #a855f7;
        }
        .share-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .share-action-btn {
            flex: 1;
            min-width: 140px;
            padding: 14px 20px;
            border-radius: 50px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s;
            text-decoration: none;
        }
        .share-action-primary {
            background: linear-gradient(135deg, #8b5cf6, #a855f7, #ec4899);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }
        .share-action-primary:hover {
            box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
            transform: translateY(-1px);
        }
        .share-action-secondary {
            background: rgba(139, 92, 246, 0.1);
            border: 1.5px solid rgba(139, 92, 246, 0.3);
            color: #c084fc;
        }
        .share-action-secondary:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: #a855f7;
        }
        .loading-state, .error-state {
            text-align: center;
            padding: 60px 20px;
        }
        .loading-state i {
            font-size: 40px;
            color: #a855f7;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-state i {
            font-size: 48px;
            color: #ef4444;
            margin-bottom: 16px;
        }
        .error-state h2, .loading-state h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .error-state p, .loading-state p {
            color: #9ca3af;
            font-size: 14px;
        }
        .share-cta {
            text-align: center;
            margin-top: 32px;
            padding: 24px;
            background: rgba(139, 92, 246, 0.05);
            border: 1px dashed rgba(139, 92, 246, 0.3);
            border-radius: 20px;
        }
        .share-cta p {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 14px;
        }
        .share-cta a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
        }
        .share-cta a:hover {
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
            transform: translateY(-1px);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="share-container">
        <div class="share-header">
            <a href="/" class="share-logo">
                <i class="fas fa-brain"></i> Vaenorix
            </a>
            <p class="share-tagline">Your AI Second Brain</p>
        </div>

        <div id="shareCard">
            <div class="share-card">
                <div class="loading-state">
                    <i class="fas fa-circle-notch"></i>
                    <h2>Loading memory...</h2>
                    <p>Please wait a moment</p>
                </div>
            </div>
        </div>

        <div class="share-cta">
            <p>Want to save your own memories?</p>
            <a href="/">
                <i class="fas fa-rocket"></i> Try Vaenorix Free
            </a>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB4SxkLnozpPFv7O_jGljLvNXQW-Lbnapc",
          authDomain: "veanorix.firebaseapp.com",
          databaseURL: "https://veanorix-default-rtdb.firebaseio.com",
          projectId: "veanorix",
          storageBucket: "veanorix.firebasestorage.app",
          messagingSenderId: "935840989114",
          appId: "1:935840989114:web:607fc547721a6efdbc6783",
          measurementId: "G-1QHMX1R51N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const shareCard = document.getElementById('shareCard');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function timeAgo(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
            return date.toLocaleDateString();
        }

        async function loadSharedMemory() {
            const params = new URLSearchParams(window.location.search);
            const shareId = params.get('id');

            if (!shareId) {
                showError('No memory specified', 'This link seems broken or incomplete.');
                return;
            }

            try {
                const shareRef = doc(db, 'public_memories', shareId);
                const shareSnap = await getDoc(shareRef);

                if (!shareSnap.exists()) {
                    showError('Memory not found', 'This memory may have been deleted or the link is invalid.');
                    return;
                }

                const data = shareSnap.data();
                renderMemory(data);
            } catch (error) {
                console.error('Error loading share:', error);
                showError('Failed to load', 'Something went wrong. Please try again.');
            }
        }

        function showError(title, message) {
            shareCard.innerHTML = `
                <div class="share-card">
                    <div class="error-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>${title}</h2>
                        <p>${message}</p>
                    </div>
                </div>
            `;
        }

        function renderMemory(memory) {
            const typeLabel = memory.type === 'note' ? 'Note' : memory.type === 'link' ? 'Link' : 'Image';
            const typeIcon = memory.type === 'note' ? 'fa-sticky-note' : memory.type === 'link' ? 'fa-link' : 'fa-image';

            let contentHtml = '';
            if (memory.type === 'image') {
                contentHtml = `<img src="${memory.content}" class="share-image" alt="Shared memory">`;
            } else if (memory.type === 'link') {
                contentHtml = `<a href="${memory.content}" target="_blank" rel="noopener">${escapeHtml(memory.content)}</a>`;
            } else {
                contentHtml = escapeHtml(memory.content);
            }

            const tagsHtml = memory.tags && memory.tags.length > 0
                ? `<div class="share-tags">${memory.tags.map(t => `<span class="share-tag">${escapeHtml(t)}</span>`).join('')}</div>`
                : '';

            const shareUrl = window.location.href;

            shareCard.innerHTML = `
                <div class="share-card">
                    <div class="share-type-badge">
                        <i class="fas ${typeIcon}"></i> ${typeLabel}
                    </div>
                    <div class="share-content">${contentHtml}</div>
                    ${tagsHtml}
                    <div class="share-footer-info">
                        <span><i class="fas fa-clock"></i> ${timeAgo(memory.timestamp)}</span>
                        <span><i class="fas fa-share-alt"></i> Shared via Vaenorix</span>
                    </div>
                    <div class="share-actions">
                        <button class="share-action-btn share-action-primary" id="copyBtn">
                            <i class="fas fa-copy"></i> Copy Link
                        </button>
                        <a href="/" class="share-action-btn share-action-secondary">
                            <i class="fas fa-plus"></i> Save Yours
                        </a>
                    </div>
                </div>
            `;

            document.getElementById('copyBtn').addEventListener('click', async function() {
                try {
                    await navigator.clipboard.writeText(shareUrl);
                    showToast('✅ Link copied!');
                } catch (e) {
                    showToast('Failed to copy');
                }
            });
        }

        loadSharedMemory();
    </script>
</body>
  </html>
