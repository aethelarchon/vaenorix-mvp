<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Vaenorix - Your AI Second Brain</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <!-- Firebase SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        /* ===== রিসেট ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* ===== কন্টেইনার ===== */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* ===== ন্যাভবার ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 28px; color: #00ffff; }
        .logo-text { font-size: 22px; font-weight: bold; }
        .nav-actions { display: flex; gap: 10px; align-items: center; }
        .nav-actions button {
            padding: 8px 20px;
            border-radius: 50px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        #loginBtn {
            background: linear-gradient(135deg, #00ffff, #0066ff);
            color: #0a0a0f;
        }
        #logoutBtn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            display: none;
        }
        #logoutBtn:hover { background: rgba(255,0,0,0.3); }
        .user-badge {
            color: #00ffff;
            font-size: 14px;
            display: none;
        }
        
        /* ===== সেভ সেকশন ===== */
        .save-section {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .save-section h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #00ffff;
        }
        .save-section textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(0,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 15px;
            resize: vertical;
            min-height: 80px;
            outline: none;
            font-family: inherit;
        }
        .save-section textarea:focus {
            border-color: #00ffff;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .input-row input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 50px;
            border: 1px solid rgba(0,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 14px;
            outline: none;
        }
        .input-row input:focus {
            border-color: #00ffff;
        }
        .btn-primary {
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #00ffff, #0066ff);
            color: #0a0a0f;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(0,255,255,0.2); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* ===== ফিল্টার ===== */
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .filter-btn {
            padding: 6px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-btn.active {
            background: rgba(0,255,255,0.15);
            border-color: #00ffff;
            color: #00ffff;
        }
        .filter-btn:hover { border-color: #00ffff; color: #fff; }
        
        /* ===== মেমোরি কার্ড ===== */
        #memoriesList {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }
        .memory-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 18px 20px;
            transition: 0.3s;
        }
        .memory-card:hover { border-color: rgba(0,255,255,0.2); }
        .memory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .memory-type {
            font-size: 12px;
            padding: 3px 12px;
            border-radius: 50px;
            background: rgba(0,255,255,0.1);
            color: #00ffff;
            text-transform: uppercase;
        }
        .memory-content {
            color: #ddd;
            font-size: 15px;
            word-break: break-word;
        }
        .memory-content a {
            color: #00ffff;
            text-decoration: none;
        }
        .memory-content a:hover { text-decoration: underline; }
        .empty-message {
            text-align: center;
            color: #666;
            padding: 40px 0;
            font-size: 16px;
        }
        
        /* ===== ড্রপডাউন মেনু ===== */
        .menu-container { position: relative; }
        .three-dots {
            background: none;
            border: none;
            color: #888;
            font-size: 22px;
            cursor: pointer;
            padding: 0 8px;
        }
        .three-dots:hover { color: #fff; }
        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 30px;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 120px;
            display: none;
            z-index: 100;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-menu button {
            background: none;
            border: none;
            color: #ddd;
            padding: 8px 20px;
            width: 100%;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
        }
        .dropdown-menu button:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .dropdown-menu .delete-btn-menu { color: #ff6666; }
        .dropdown-menu .delete-btn-menu:hover { background: rgba(255,0,0,0.1); }
        
        /* ===== টোস্ট ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1a1a2e;
            border: 1px solid rgba(0,255,255,0.2);
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            opacity: 0;
            transition: 0.4s ease;
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            border-color: #ff4444;
            background: #2a0a0a;
        }
        
        /* ===== ফুটার ===== */
        .footer {
            text-align: center;
            padding: 30px 0 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 30px;
            color: #555;
            font-size: 14px;
        }
        
        /* ===== রেস্পন্সিভ ===== */
        @media (max-width: 600px) {
            .input-row { flex-direction: column; }
            .btn-primary { width: 100%; justify-content: center; }
            .navbar { flex-wrap: wrap; gap: 10px; }
            .nav-actions { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- ===== ন্যাভবার ===== -->
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-brain logo-icon"></i>
                <span class="logo-text">Vaenorix</span>
            </div>
            <div class="nav-actions">
                <span class="user-badge" id="userBadge">👤</span>
                <button id="loginBtn"><i class="fab fa-google"></i> Sign In</button>
                <button id="logoutBtn">Sign Out</button>
            </div>
        </nav>
        
        <!-- ===== সেভ সেকশন ===== -->
        <div class="save-section">
            <h2><i class="fas fa-pen"></i> Save a Memory</h2>
            <textarea id="noteInput" placeholder="Write a note..."></textarea>
            <div class="input-row">
                <input type="text" id="linkInput" placeholder="Paste a link (optional)" />
                <button class="btn-primary" id="saveBtn"><i class="fas fa-save"></i> Save</button>
            </div>
        </div>
        
        <!-- ===== ফিল্টার ===== -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="note">Notes</button>
            <button class="filter-btn" data-filter="link">Links</button>
        </div>
        
        <!-- ===== মেমোরি লিস্ট ===== -->
        <div id="memoriesList">
            <div class="empty-message">Sign in to start saving memories</div>
        </div>
        
        <!-- ===== ফুটার ===== -->
        <div class="footer">
            Vaenorix — Your AI Second Brain
        </div>
    </div>
    
    <!-- ===== টোস্ট ===== -->
    <div id="toast" class="toast"></div>
    
    <!-- ============================================================ -->
    <!-- ===== মূল JavaScript (Firebase + সব লজিক) ===== -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // ১. Firebase কনফিগারেশন (আপনার দেওয়া ডেটা)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB4SxkLnozpPFv7O_jGljLvNXQW-Lbnapc",
            authDomain: "veanorix.firebaseapp.com",
            projectId: "veanorix",
            storageBucket: "veanorix.firebasestorage.app",
            messagingSenderId: "935840989114",
            appId: "1:935840989114:web:607fc547721a6efdbc6783",
            measurementId: "G-1QHMX1R51N"
        };

        // Firebase Initialize
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const GoogleAuthProvider = new firebase.auth.GoogleAuthProvider();

        console.log("✅ Firebase connected!");

        // ============================================================
        // ২. DOM এলিমেন্ট গুলো
        // ============================================================
        const noteInput = document.getElementById('noteInput');
        const linkInput = document.getElementById('linkInput');
        const saveBtn = document.getElementById('saveBtn');
        const memoriesList = document.getElementById('memoriesList');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userBadge = document.getElementById('userBadge');
        const toast = document.getElementById('toast');

        let memories = [];
        let currentUser = null;
        let currentFilter = 'all';

        // ============================================================
        // ৩. টোস্ট ফাংশন
        // ============================================================
        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = 'toast';
            if (isError) toast.classList.add('error');
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // ৪. Firebase Auth স্টেট চেক
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                userBadge.style.display = 'inline-block';
                userBadge.textContent = '👤 ' + (user.displayName || user.email).split('@')[0];
                await loadMemories();
            } else {
                currentUser = null;
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
                userBadge.style.display = 'none';
                memoriesList.innerHTML = '<div class="empty-message">🔑 Sign in to save your memories</div>';
                memories = [];
            }
        });

        // ============================================================
        // ৫. লগইন / লগআউট
        // ============================================================
        loginBtn.onclick = () => {
            auth.signInWithPopup(GoogleAuthProvider)
                .then(() => showToast('Welcome! 🚀'))
                .catch((err) => showToast('Login failed: ' + err.message, true));
        };

        logoutBtn.onclick = () => {
            auth.signOut()
                .then(() => showToast('Signed out'))
                .catch(() => showToast('Logout failed', true));
        };

        // ============================================================
        // ৬. মেমোরি লোড করা
        // ============================================================
        async function loadMemories() {
            if (!currentUser) return;
            try {
                const snapshot = await db.collection(`users/${currentUser.uid}/memories`)
                    .orderBy('timestamp', 'desc')
                    .get();
                memories = [];
                snapshot.forEach(doc => {
                    memories.push({ id: doc.id, ...doc.data() });
                });
                renderMemories();
            } catch (error) {
                console.error('Load error:', error);
                memoriesList.innerHTML = '<div class="empty-message">❌ Failed to load memories</div>';
            }
        }

        // ============================================================
        // ৭. মেমোরি রেন্ডার করা
        // ============================================================
        function renderMemories() {
            if (!currentUser) return;
            if (memories.length === 0) {
                memoriesList.innerHTML = '<div class="empty-message">📭 No memories yet. Save one!</div>';
                return;
            }

            let filtered = memories;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(m => m.type === currentFilter);
            }

            if (filtered.length === 0) {
                memoriesList.innerHTML = '<div class="empty-message">🔍 No memories found</div>';
                return;
            }

            memoriesList.innerHTML = filtered.map(m => `
                <div class="memory-card">
                    <div class="memory-header">
                        <span class="memory-type">${m.type || 'note'}</span>
                        <div class="menu-container">
                            <button class="three-dots" data-id="${m.id}">⋯</button>
                            <div class="dropdown-menu" id="menu-${m.id}">
                                <button class="edit-btn" data-id="${m.id}">✏️ Edit</button>
                                <button class="delete-btn-menu" data-id="${m.id}">🗑️ Delete</button>
                            </div>
                        </div>
                    </div>
                    <div class="memory-content">
                        ${m.type === 'link' 
                            ? `<a href="${m.content}" target="_blank">${m.content}</a>` 
                            : m.content}
                    </div>
                </div>
            `).join('');

            // ===== ড্রপডাউন মেনু =====
            document.querySelectorAll('.three-dots').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
                    const menu = document.getElementById('menu-' + id);
                    if (menu) menu.classList.toggle('show');
                };
            });

            // ===== Edit =====
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const memory = memories.find(m => m.id === id);
                    if (memory) {
                        const newContent = prompt('Edit memory:', memory.content);
                        if (newContent && newContent.trim()) {
                            updateMemory(id, newContent.trim());
                        }
                    }
                    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
                };
            });

            // ===== Delete =====
            document.querySelectorAll('.delete-btn-menu').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    if (confirm('Delete this memory?')) {
                        deleteMemory(id);
                    }
                    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
                };
            });

            // ===== বাইরে ক্লিক করলে মেনু বন্ধ =====
            document.onclick = () => {
                document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            };
        }

        // ============================================================
        // ৮. মেমোরি সেভ/এডিট/ডিলিট
        // ============================================================
        async function addMemory() {
            if (!currentUser) {
                showToast('Please sign in first!', true);
                return;
            }
            const note = noteInput.value.trim();
            const link = linkInput.value.trim();
            if (!note && !link) {
                showToast('Write something or paste a link', true);
                return;
            }

            const type = link ? 'link' : 'note';
